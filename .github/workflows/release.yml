name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build addon package
        run: |
          mkdir -p package/ChatHeightExpander
          cp ChatHeightExpander.lua package/ChatHeightExpander/
          cp ChatHeightExpander.toc package/ChatHeightExpander/
          cd package
          zip -r ../ChatHeightExpander.zip ChatHeightExpander

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatHeightExpander
          path: ChatHeightExpander.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ChatHeightExpander.zip
          body_path: CHANGELOG.md
